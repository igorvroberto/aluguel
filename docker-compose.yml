# Stack isolado na VPS Liganer (mesma máquina do /opt/imoveis).
# PROIBIDO: volumes, env ou networks de /opt/chatwoot*, chatwoot_*.
# Raiz: /opt/radar-imoveis
# Traefik: /opt/traefik/dynamic/radar-imoveis.yml → 127.0.0.1:18090
# Domínio sugerido: radar.liganer.com.br

name: radar-imoveis

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"
    tag: "{{.Name}}"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_MAPBOX_TOKEN: ${NEXT_PUBLIC_MAPBOX_TOKEN:-}
    image: radar-imoveis:v0.1
    container_name: radar-imoveis-web
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
    ports:
      - "127.0.0.1:18090:3000"
    networks:
      - internal
    mem_limit: 512m
    cpus: 0.75
    logging: *default-logging

networks:
  internal:
    name: radar_imoveis_internal
    driver: bridge
