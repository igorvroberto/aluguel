name: Deploy VPS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".gitignore"

jobs:
  deploy:
    # Runner self-hosted na VPS (/opt/radar-imoveis).
    # Chama o script VIA sudo (casa com /etc/sudoers.d/radar-imoveis-runner-deploy).
    # Assim roda como root de cara — não depende da elevação interna do deploy.sh local.
    runs-on: [self-hosted, radar-imoveis]
    steps:
      - name: Deploy Imóveis Radar
        run: sudo -n /opt/radar-imoveis/tools/deploy.sh
