name: Deploy VPS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".gitignore"

jobs:
  deploy:
    # Runner self-hosted na VPS (/opt/radar-imoveis). Sem SSH externo.
    runs-on: [self-hosted, radar-imoveis]
    steps:
      - name: Deploy Perdizes Radar
        run: bash /opt/radar-imoveis/tools/deploy.sh
        env:
          RADAR_IMOVEIS_ROOT: /opt/radar-imoveis
          RADAR_IMOVEIS_REF: main
