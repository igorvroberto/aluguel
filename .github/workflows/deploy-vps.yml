name: Deploy VPS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".gitignore"

jobs:
  deploy:
    # Runner self-hosted na mesma VPS do /opt/radar-imoveis (uma vez: tools/setup-github-runner.sh).
    runs-on: [self-hosted, radar-imoveis]
    steps:
      - name: Deploy Perdizes Radar
        run: sudo -n bash /opt/radar-imoveis/tools/deploy.sh
        env:
          RADAR_IMOVEIS_ROOT: /opt/radar-imoveis
          RADAR_IMOVEIS_REF: main
